name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - urban-heat-island-analysis
          - flood-risk-assessment
          - crop-health-ndvi-monitoring
          - healthcare-access-analysis
          - forest-change-detection
          - solar-site-suitability

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit and end-to-end tests
        run: python -m pytest tests -q

      - name: Demo runs end to end (small grid)
        run: python demo.py --size 80 --out results/ci

      - name: QGIS Processing script compiles and styles are valid XML
        run: |
          python -m py_compile qgis/processing/*.py
          for f in qgis/styles/*.qml; do python -c "import xml.dom.minidom,sys; xml.dom.minidom.parse(sys.argv[1])" "$f"; done

      - name: Streamlit app imports cleanly
        run: python -c "import ast; ast.parse(open('app.py').read()); print('app.py OK')"

      - name: Upload demo outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-demo
          path: |
            ${{ matrix.project }}/results/ci/summary.json
            ${{ matrix.project }}/results/ci/*.csv
          if-no-files-found: ignore
