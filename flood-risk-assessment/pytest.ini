[pytest]
testpaths = tests
addopts = -p no:cacheprovider
filterwarnings =
    ignore::PendingDeprecationWarning
    ignore::DeprecationWarning:rasterio.*
    ignore::DeprecationWarning:affine.*
    ignore::DeprecationWarning:rasterstats.*
    ignore::FutureWarning:geopandas.*
    ignore::UserWarning:folium.*
